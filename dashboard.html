<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vault 13 – Dashboard</title>
  <link rel="stylesheet" href="assets/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="crosshair" id="crosshair"></div>
  <div class="stars" id="stars"></div>
  <div class="grid" id="grid"></div>
  <div class="scanline" id="scanline"></div>

  <!-- ==== FULL DASHBOARD MARKUP (same as original) ==== -->
  <div class="dashboard" id="dashboard">
    <!-- Paste the ENTIRE <div class="dashboard"> from your original file here -->
    <!-- Includes sidebar, overview, customize, admin panel -->
  </div>

  <script src="assets/script.js"></script>
  <script>
    createStars();
    $('stars').style.opacity = '1';
    $('grid').style.opacity = '1';
    $('scanline').style.opacity = '1';
    setInterval(updateVisitors, 3000);
    setInterval(updateUptime, 1000);

    const params = new URLSearchParams(location.search);
    const u = params.get('u');
    if (!u || !localStorage.getItem(`profile_${u}`)) {
      alert('Access denied.');
      location.href = 'login.html';
    } else {
      goDash(u);
    }
  </script>
</body>
</html>
