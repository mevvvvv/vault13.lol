<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mev/vsqz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        :root {
            --p: #9d4edd;
            --bg: #000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: var(--bg); }

        /* Full GIF Background */
        .bg-gif {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.15);
        }

        /* Landing */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--p), 0 0 30px var(--p);
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
        }

        .enter {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--p);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            text-shadow: 0 0 10px var(--p);
        }

        /* Glitch Out */
        #landing.out {
            animation: glitchFade 1.4s forwards;
            pointer-events: none;
        }
        @keyframes glitchFade {
            0% { opacity: 1; filter: blur(0); }
            50% { opacity: 0.7; filter: blur(2px); transform: scale(1.02); }
            100% { opacity: 0; filter: blur(8px); transform: scale(1.05); }
        }

        /* Advanced Center Frame */
        #frame {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 460px;
            background: rgba(8, 8, 12, 0.92);
            border: 1.5px solid var(--p);
            border-radius: 14px;
            padding: 2rem 1.8rem;
            text-align: center;
            box-shadow: 
                0 0 40px rgba(157, 78, 221, 0.6),
                inset 0 0 20px rgba(157, 78, 221, 0.1);
            backdrop-filter: blur(10px);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #frame.in {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        .pfp-ring {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 1.2rem;
        }
        .pfp {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 0 20px var(--p);
        }
        .ring-glow {
            position: absolute;
            top: -8px; left: -8px;
            width: 126px; height: 126px;
            border: 2px solid var(--p);
            border-radius: 50%;
            opacity: 0.7;
            animation: pulseRing 3s infinite;
        }
        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 0.4; }
        }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--p);
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px var(--p);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .link {
            background: rgba(157, 78, 221, 0.12);
            border: 1px solid var(--p);
            border-radius: 10px;
            padding: 0.85rem;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .link::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.5s;
        }
        .link:hover::before { left: 100%; }
        .link:hover {
            background: rgba(157, 78, 221, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(157, 78, 221, 0.3);
        }
        .link img {
            width: 18px; height: 18px;
            margin-right: 8px;
            filter: brightness(0) invert(1);
        }

        /* Audio */
        #sfx { display: none; }

        /* Mobile */
        @media (max-width: 480px) {
            .title { font-size: 2.2rem; }
            .enter { font-size: 0.85rem; }
            #frame { padding: 1.6rem 1.4rem; max-width: 92%; }
            .pfp-ring { width: 90px; height: 90px; }
            .ring-glow { width: 106px; height: 106px; top: -8px; left: -8px; }
            .name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Background GIF -->
    <img src="https://vault13.lol/squeez.gif" class="bg-gif" alt="bg">

    <!-- Landing -->
    <div id="landing" onclick="enter()">
        <div class="title">mev/vsqz</div>
        <div class="enter">click to enter hell</div>
    </div>

    <!-- Audio -->
    <audio id="sfx" src="https://github.com/mevvvvv/vault13.lol/raw/refs/heads/main/heheee.mp3"></audio>

    <!-- Advanced Frame -->
    <div id="frame">
        <div class="pfp-ring">
            <div class="ring-glow"></div>
            <!-- CHANGE PFP -->
            <img src="https://cdn.discordapp.com/attachments/1363714836621689002/1434441273703534713/mhhh.png?ex=6908570a&is=6907058a&hm=a045d8b3594ec75bfad7b8e8e6cba84a81f8c6fcfe98a68f9c2448370d028124&" alt="pfp" class="pfp">
        </div>
        <div class="name">mev/vsqz</div>
        <div class="links">
            <!-- EDIT LINKS -->
            <a href="#" class="link"><img src="https://cdn.simpleicons.org/discord/white"> Discord</a>
            <a href="#" class="link"><img src="https://cdn.simpleicons.org/roblox/white"> Roblox</a>
            <a href="https://github.com/mevvvvv" class="link"><img src="https://cdn.simpleicons.org/github/white"> GitHub</a>
        </div>
    </div>

    <script>
        function enter() {
            const land = document.getElementById('landing');
            const frame = document.getElementById('frame');
            const audio = document.getElementById('sfx');

            audio.play().catch(() => {});
            land.classList.add('out');

            setTimeout(() => {
                land.style.display = 'none';
                frame.classList.add('in');
            }, 1400);
        }
    </script>

</body>
</html>
