<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mev/vsqz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        :root {
            --bg: #000;
            --card: rgba(8, 8, 12, 0.05);
            --border: rgba(255, 255, 255, 0.05);
            --glow: rgba(255, 255, 255, 0.03);
            --text: #fff;
            --subtext: #ccc;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        
        html, body { 
            height: 100%; 
            overflow: hidden; 
            background: var(--bg); 
            font-family: 'Orbitron', sans-serif; 
        }

        /* Remove text selection */
        *::selection {
            background: transparent;
        }
        *::-moz-selection {
            background: transparent;
        }

        /* Background GIF */
        .bg-gif {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.2);
        }

        /* Landing */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #fff,
                0 0 20px #000,
                0 0 35px #000,
                0 0 40px #000;
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
        }

        .enter {
            font-size: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #000,
                0 0 20px #000;
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Fade Out */
        #landing.out {
            animation: fadeOut 1.4s forwards;
            pointer-events: none;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; filter: blur(14px); transform: scale(1.05); }
        }

        /* Container for both frames */
        .frames-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 1.5rem;
            z-index: 5;
            width: 95%;
            max-width: 850px;
            justify-content: center;
            align-items: flex-start;
        }

        /* Ultra-Ghost Frame */
        #frame {
            width: 380px;
            background: var(--card);
            border: 1.2px solid var(--border);
            border-radius: 16px;
            padding: 1.8rem 1.5rem;
            text-align: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            transform-style: preserve-3d;
        }
        #frame.in { opacity: 1; pointer-events: all; }

        /* Side Panel Frame */
        #side-frame {
            width: 240px;
            background: var(--card);
            border: 1.2px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            transform-style: preserve-3d;
        }
        #side-frame.in { opacity: 1; pointer-events: all; }

        .side-title {
            font-size: 1rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.1em;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #000,
                0 0 20px #000;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Custom scrollbar */
        .accounts-list::-webkit-scrollbar {
            width: 3px;
        }

        .accounts-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .accounts-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .account-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .account-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(3px);
        }

        .account-name {
            font-size: 0.8rem;
            color: #ffffff;
            letter-spacing: 0.05em;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #000;
        }

        .pfp-ring {
            position: relative;
            width: 90px; 
            height: 90px;
            margin: 0 auto 1rem;
        }
        .pfp {
            width: 100%; 
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }
        .ring-glow {
            position: absolute;
            top: -6px; 
            left: -6px;
            width: 102px; 
            height: 102px;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.25); opacity: 0.05; }
        }

        .name {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #fff,
                0 0 20px #000,
                0 0 35px #000,
                0 0 40px #000;
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Bio with Typewriter Effect */
        .bio {
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 1.2rem;
            min-height: 1.5em;
            letter-spacing: 0.1em;
            overflow: hidden;
            white-space: nowrap;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #000,
                0 0 20px #000;
        }

        /* Circle Links */
        .circle-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .circle {
            width: 42px; 
            height: 42px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }
        .circle:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.2) translateY(-4px);
        }
        .circle img {
            width: 20px; 
            height: 20px;
            filter: brightness(0) invert(1);
            opacity: 0.85;
        }

        /* Audio Player */
        #audio-player {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(8, 8, 12, 0.1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            backdrop-filter: blur(8px);
        }
        #audio-player.show { opacity: 1; pointer-events: all; }

        .song-name {
            font-size: 0.75rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.9;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #000;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
        }

        .play-btn {
            background: none;
            border: 1.2px solid var(--border);
            color: #ffffff;
            width: 34px; 
            height: 34px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #000;
        }
        .play-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.12);
        }

        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 0.8rem;
        }
        .progress {
            height: 100%;
            background: #ffffff;
            width: 0%;
            border-radius: 2px;
            opacity: 0.7;
            box-shadow: 0 0 5px #fff, 0 0 10px #000;
        }

        /* Volume Control */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .volume-icon {
            color: #ffffff;
            font-size: 0.8rem;
            opacity: 0.8;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #000;
        }

        .volume-slider {
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            opacity: 0.8;
            box-shadow: 0 0 5px #fff, 0 0 10px #000;
        }

        .volume-slider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            opacity: 0.8;
            border: none;
            box-shadow: 0 0 5px #fff, 0 0 10px #000;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .frames-container {
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
            }
            
            #frame, #side-frame {
                width: 90%;
                max-width: 380px;
            }
            
            .title { font-size: 2.2rem; }
            .enter { font-size: 0.85rem; }
            #frame { padding: 1.5rem; }
            .circle { width: 40px; height: 40px; }
            .circle img { width: 18px; height: 18px; }
            .play-btn { width: 32px; height: 32px; font-size: 0.75rem; }
            .song-name { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Background GIF -->
    <img src="https://vault13.lol/bmw-m3-nohesi.gif" class="bg-gif" alt="bg">

    <!-- Landing -->
    <div id="landing" onclick="enter()">
        <div class="title" id="landing-title"></div>
        <div class="enter" id="landing-subtitle"></div>
    </div>

    <!-- Audio (Loop Forever) -->
    <audio id="hellsong" src="https://github.com/mevvvvv/vault13.lol/raw/refs/heads/main/freestyle.mp3" loop preload="auto"></audio>

    <!-- Frames Container -->
    <div class="frames-container">
        <!-- Main Frame -->
        <div id="frame">
            <div class="pfp-ring">
                <div class="ring-glow"></div>
                <img src="https://cdn.discordapp.com/attachments/1363714836621689002/1434441273703534713/mhhh.png?ex=6908570a&is=6907058a&hm=a045d8b3594ec75bfad7b8e8e6cba84a81f8c6fcfe98a68f9c2448370d028124&" alt="pfp" class="pfp">
            </div>
            <div class="name" id="profile-name"></div>
            <div class="bio" id="bio"></div>

            <!-- Circle Links -->
            <div class="circle-links">
                <a href="https://discord.gg/bkNT9x3qs9" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/discord/white" alt="Discord">
                </a>
                <a href="https://www.roblox.com/users/7758899851/profile" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/roblox/white" alt="Roblox">
                </a>
                <a href="https://github.com/mevvvvv" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/github/white" alt="GitHub">
                </a>
            </div>
        </div>

        <!-- Side Frame for Discord Accounts -->
        <div id="side-frame">
            <div class="side-title">4-Letter Discord Accounts</div>
            <div class="accounts-list" id="accounts-list">
                <!-- Accounts will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Audio Player -->
    <div id="audio-player">
        <div class="song-name">Freestyle - mev/vsqz</div>
        <div class="player-controls">
            <button class="play-btn" id="play-btn">▶</button>
            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>
            <div class="volume-container">
                <span class="volume-icon">🔊</span>
                <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" id="volume-slider">
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('hellsong');
        const progress = document.getElementById('progress');
        const frame = document.getElementById('frame');
        const sideFrame = document.getElementById('side-frame');
        const player = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const bio = document.getElementById('bio');
        const landingTitle = document.getElementById('landing-title');
        const landingSubtitle = document.getElementById('landing-subtitle');
        const profileName = document.getElementById('profile-name');
        const accountsList = document.getElementById('accounts-list');

        // Discord accounts data
        const discordAccounts = [
            "@6kux", "@4yta", "@0j62", "@3pn6", "@4bph", "@8lda", 
            "@f7ev", "@xw0v", "@7kpu", "@7kpk", "@d4o2", "@8usf", "@0r1h"
        ];

        // Populate accounts list
        function populateAccounts() {
            accountsList.innerHTML = '';
            discordAccounts.forEach(account => {
                const accountItem = document.createElement('div');
                accountItem.className = 'account-item';
                accountItem.innerHTML = `<div class="account-name">${account}</div>`;
                accountsList.appendChild(accountItem);
            });
        }

        // Remove focus outlines
        document.addEventListener('mousedown', function() {
            document.activeElement.blur();
        });

        // Force loop
        audio.loop = true;
        audio.onended = () => audio.play();

        // Typewriter function with delete and repeat
        function typeWriterRepeat(element, text, speed = 100, pause = 2000) {
            let isDeleting = false;
            let i = 0;
            
            function type() {
                const currentText = text.substring(0, i);
                
                if (!isDeleting) {
                    // Typing phase
                    element.textContent = currentText;
                    i++;
                    
                    if (i > text.length) {
                        // Finished typing, pause then start deleting
                        setTimeout(() => {
                            isDeleting = true;
                            type();
                        }, pause);
                        return;
                    }
                } else {
                    // Deleting phase
                    element.textContent = currentText;
                    i--;
                    
                    if (i === 0) {
                        // Finished deleting, pause then start typing again
                        isDeleting = false;
                        setTimeout(type, speed * 2);
                        return;
                    }
                }
                
                setTimeout(type, isDeleting ? speed / 2 : speed);
            }
            
            // Start the animation
            type();
        }

        // Start typewriter effects on page load
        window.onload = function() {
            populateAccounts();
            typeWriterRepeat(landingTitle, "mev/vsqz", 120, 3000);
            setTimeout(() => {
                typeWriterRepeat(landingSubtitle, "click to enter hell", 80, 2500);
            }, 1000);
        };

        // Enter
        function enter() {
            document.getElementById('landing').classList.add('out');
            audio.play();
            setTimeout(() => {
                document.getElementById('landing').style.display = 'none';
                frame.classList.add('in');
                sideFrame.classList.add('in');
                player.classList.add('show');
                
                // Start profile typewriter effects
                typeWriterRepeat(profileName, "mev/vsqz", 120, 3000);
                setTimeout(() => {
                    typeWriterRepeat(bio, "Gate Way To Hell", 100, 2500);
                }, 1000);
            }, 1400);
        }

        // Play/Pause button
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '❚❚';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        });

        // Progress bar (visual only)
        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100 || 0;
            progress.style.width = percent + '%';
        };

        // Volume control
        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value;
        });

        // Mouse Tilt for both frames
        document.addEventListener('mousemove', (e) => {
            if (!frame.classList.contains('in')) return;
            const x = (window.innerWidth / 2 - e.clientX) / 45;
            const y = (window.innerHeight / 2 - e.clientY) / 45;
            frame.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${x}deg)`;
            sideFrame.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${x}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            frame.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
            sideFrame.style.transform = `perspective(1000px) rotateX(0) rotateY(0)`;
        });
    </script>

</body>
</html>
