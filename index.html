<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mev/vsqz | VOIDGATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Share+Tech+Mono&display=swap');
        
        :root {
            --bg: #000;
            --card: rgba(15, 15, 15, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --glow: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --subtext: #cccccc;
            --accent: #ffffff;
            --noise-opacity: 0.05;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Orbitron', sans-serif;
            cursor: none;
            filter: contrast(1.1) brightness(1.05);
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.08s ease, opacity 0.3s ease;
            box-shadow: 0 0 12px var(--accent), 0 0 25px var(--accent);
            mix-blend-mode: difference;
        }
        .cursor::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 5px; height: 5px;
            background: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Noise Overlay */
        .noise {
            position: fixed;
            inset: 0;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAPklEQVQYV2NkYGD4z8DAwMgABXAGBgaG/////38GRiYGP/7/TPD/f4ZGBgYQP/5nYGRgYGBgYGBgYGBgYGBgYGBgAOXpAb4hM7oAAAAASUVORK5CYII=') repeat;
            opacity: var(--noise-opacity);
            pointer-events: none;
            z-index: 1;
            animation: noise 0.15s steps(2) infinite;
        }
        @keyframes noise { 0% { transform: translate(0,0); } 100% { transform: translate(1px,1px); } }

        /* Background GIF - Desaturated */
        .bg-gif {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 110%; min-height: 110%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.8) contrast(1.3);
            transition: filter 0.6s ease;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.04), rgba(0,0,0,0.04) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        /* Landing */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: none;
            backdrop-filter: blur(10px) grayscale(100%);
        }
        .title {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: 0.18em;
            margin-bottom: 0.8rem;
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
            text-shadow: 
                0 0 15px var(--glow),
                0 0 30px var(--glow),
                0 0 50px var(--glow);
            animation: titleFlicker 4s infinite alternate;
        }
        @keyframes titleFlicker {
            0%, 100% { text-shadow: 0 0 15px #fff, 0 0 30px #fff; }
            50% { text-shadow: 0 0 25px #fff, 0 0 50px #fff, 0 0 70px #fff; }
        }
        .enter {
            font-size: 1.1rem;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.25em;
            font-weight: 500;
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
            opacity: 0.85;
            animation: pulseEnter 2.2s infinite;
            text-shadow: 0 0 10px var(--glow);
        }
        @keyframes pulseEnter {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Fade Out */
        #landing.out {
            animation: voidExit 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            pointer-events: none;
        }
        @keyframes voidExit {
            0% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(25px); transform: scale(1.25); }
        }

        /* Frames Container */
        .frames-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 1.8rem;
            z-index: 5;
            width: 95%;
            max-width: 900px;
            justify-content: center;
            align-items: flex-start;
            perspective: 1500px;
        }

        /* Ghost Frame - Pure Transparency */
        #frame, #side-frame {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 2rem 1.8rem;
            text-align: center;
            backdrop-filter: blur(18px) grayscale(100%);
            opacity: 0;
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 
                0 10px 35px rgba(0,0,0,0.4),
                0 0 25px var(--glow),
                inset 0 0 20px rgba(255,255,255,0.04);
            transform-style: preserve-3d;
        }
        #frame.in { opacity: 1; pointer-events: all; }
        #side-frame.in { opacity: 1; pointer-events: all; }

        #frame {
            width: 400px;
            background: linear-gradient(135deg, rgba(20,20,25,0.06), rgba(10,10,15,0.03));
        }
        #side-frame {
            width: 260px;
            background: linear-gradient(135deg, rgba(15,15,20,0.05), rgba(10,10,15,0.02));
        }

        /* PFP - Monochrome Holo Ring */
        .pfp-ring {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 1.2rem;
            filter: drop-shadow(0 0 12px #fff);
        }
        .pfp {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            filter: grayscale(100%) brightness(1.1);
            animation: spinBorder 8s linear infinite;
        }
        @keyframes spinBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ring-glow {
            position: absolute;
            top: -8px; left: -8px;
            width: 116px; height: 116px;
            border: 2px solid var(--border);
            border-radius: 50%;
            opacity: 0.3;
            animation: pulseMono 5s ease-in-out infinite;
            box-shadow: 0 0 20px #fff;
        }
        @keyframes pulseMono {
            0%, 100% { transform: scale(1); opacity: 0.25; }
            50% { transform: scale(1.35); opacity: 0.08; }
        }

        .name {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: 0.12em;
            margin-bottom: 0.6rem;
            text-shadow: 0 0 12px var(--glow);
            min-height: 1.2em;
            overflow: hidden;
            white-space: nowrap;
        }

        .bio {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 1.4rem;
            letter-spacing: 0.12em;
            opacity: 0.92;
            min-height: 1.5em;
            overflow: hidden;
            white-space: nowrap;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        /* Circle Links - Pure White */
        .circle-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-bottom: 1.6rem;
        }
        .circle {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .circle::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.25), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .circle:hover::before {
            opacity: 1;
        }
        .circle:hover {
            background: rgba(255,255,255,0.12);
            transform: scale(1.25) translateY(-6px);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
        .circle img {
            width: 22px;
            height: 22px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        .circle:hover img {
            filter: brightness(0) invert(1) drop-shadow(0 0 10px #fff);
        }

        /* Side Panel */
        .side-title {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 1rem;
            text-align: center;
            letter-spacing: 0.12em;
            text-shadow: 0 0 10px var(--glow);
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .accounts-list::-webkit-scrollbar {
            width: 4px;
        }
        .accounts-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
        }
        .accounts-list::-webkit-scrollbar-thumb {
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 0 12px #fff;
        }

        .account-item {
            display: flex;
            align-items: center;
            padding: 0.6rem 0.8rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .account-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }
        .account-item:hover::before {
            left: 100%;
        }
        .account-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px) scale(1.02);
            border-color: #fff;
            box-shadow: 0 0 18px rgba(255,255,255,0.4);
        }
        .account-name {
            font-size: 0.85rem;
            color: #fff;
            letter-spacing: 0.06em;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        /* Audio Player - Monochrome Hologram */
        #audio-player {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 520px;
            background: rgba(10,10,15,0.08);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 1.2s ease;
            backdrop-filter: blur(22px) grayscale(100%);
            box-shadow: 0 10px 35px rgba(0,0,0,0.5), 0 0 25px var(--glow);
        }
        #audio-player.show { opacity: 1; pointer-events: all; }

        .song-name {
            font-size: 0.8rem;
            color: #fff;
            font-weight: 600;
            letter-spacing: 0.06em;
            opacity: 0.95;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 8px #fff;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            width: 100%;
        }

        .play-btn {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid var(--border);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            box-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        .play-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.15);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.7);
        }

        .progress-container {
            flex: 1;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin: 0 1rem;
            position: relative;
        }
        .progress {
            height: 100%;
            background: #ffffff;
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 15px #fff;
            position: relative;
        }
        .progress::after {
            content: '';
            position: absolute;
            right: 0; top: 50%;
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 15px #fff;
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .volume-icon {
            color: #fff;
            font-size: 0.85rem;
            opacity: 0.9;
            filter: drop-shadow(0 0 5px #fff);
        }
        .volume-slider {
            width: 70px;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 15px #fff;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .frames-container {
                flex-direction: column;
                align-items: center;
                gap: 1.5rem;
            }
            #frame, #side-frame {
                width: 92%;
                max-width: 400px;
            }
            .title { font-size: 2.5rem; }
            .enter { font-size: 0.9rem; }
            .circle { width: 44px; height: 44px; }
            .circle img { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>

    <!-- Noise & Scanlines -->
    <div class="noise"></div>
    <div class="scanlines"></div>

    <!-- Background GIF (B&W) -->
    <img src="https://vault13.lol/bmw-m3-nohesi.gif" class="bg-gif" alt="bg">

    <!-- Landing -->
    <div id="landing" onclick="enter()">
        <div class="title" id="landing-title"></div>
        <div class="enter" id="landing-subtitle"></div>
    </div>

    <!-- Audio -->
    <audio id="hellsong" src="https://github.com/mevvvvv/vault13.lol/raw/refs/heads/main/freestyle.mp3" loop preload="auto"></audio>

    <!-- Frames -->
    <div class="frames-container">
        <div id="frame">
            <div class="pfp-ring">
                <div class="ring-glow"></div>
                <img src="https://cdn.discordapp.com/attachments/1363714836621689002/1434441273703534713/mhhh.png?ex=6908570a&is=6907058a&hm=a045d8b3594ec75bfad7b8e8e6cba84a81f8c6fcfe98a68f9c2448370d028124&" alt="pfp" class="pfp">
            </div>
            <div class="name" id="profile-name"></div>
            <div class="bio" id="bio"></div>
            <div class="circle-links">
                <a href="https://discord.gg/bkNT9x3qs9" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/discord/white" alt="Discord">
                </a>
                <a href="https://www.roblox.com/users/7758899851/profile" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/roblox/white" alt="Roblox">
                </a>
                <a href="https://github.com/mevvvvv" target="_blank" class="circle">
                    <img src="https://cdn.simpleicons.org/github/white" alt="GitHub">
                </a>
            </div>
        </div>

        <div id="side-frame">
            <div class="side-title">4-Letter Discord Accounts</div>
            <div class="accounts-list" id="accounts-list"></div>
        </div>
    </div>

    <!-- Audio Player -->
    <div id="audio-player">
        <div class="song-name">Freestyle - mev/vsqz</div>
        <div class="player-controls">
            <button class="play-btn" id="play-btn">Play</button>
            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>
            <div class="volume-container">
                <span class="volume-icon">Volume</span>
                <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" id="volume-slider">
            </div>
        </div>
    </div>

    <script>
        // === ELEMENTS ===
        const cursor = document.querySelector('.cursor');
        const audio = document.getElementById('hellsong');
        const progress = document.getElementById('progress');
        const frame = document.getElementById('frame');
        const sideFrame = document.getElementById('side-frame');
        const player = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const bio = document.getElementById('bio');
        const landingTitle = document.getElementById('landing-title');
        const landingSubtitle = document.getElementById('landing-subtitle');
        const profileName = document.getElementById('profile-name');
        const accountsList = document.getElementById('accounts-list');
        const bgGif = document.querySelector('.bg-gif');

        // === DATA ===
        const discordAccounts = [
            "@6kux", "@4yta", "@0j62", "@3pn6", "@4bph", "@8lda",
            "@f7ev", "@xw0v", "@7kpu", "@7kpk", "@d4o2", "@8usf", "@0r1h"
        ];

        // === CURSOR + TILT ===
        document.addEventListener('mousemove', (e) => {
            cursor.style.transform = `translate(${e.clientX - 9}px, ${e.clientY - 9}px)`;
            if (frame.classList.contains('in')) {
                const x = (window.innerWidth / 2 - e.clientX) / 35;
                const y = (window.innerHeight / 2 - e.clientY) / 35;
                frame.style.transform = `perspective(1500px) rotateX(${y}deg) rotateY(${x}deg) translateZ(12px)`;
                sideFrame.style.transform = `perspective(1500px) rotateX(${y}deg) rotateY(${x}deg) translateZ(12px)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            frame.style.transform = `perspective(1500px) rotateX(0) rotateY(0)`;
            sideFrame.style.transform = `perspective(1500px) rotateX(0) rotateY(0)`;
        });

        // === PARALLAX BG ===
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 18;
            const y = (e.clientY / window.innerHeight - 0.5) * 18;
            bgGif.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.1)`;
        });

        // === TYPEWRITER ===
        function typeWriterRepeat(element, text, speed = 100, pause = 2000) {
            let i = 0, isDeleting = false;
            function type() {
                const current = text.substring(0, i);
                element.textContent = current;
                if (!isDeleting && i === text.length) {
                    setTimeout(() => { isDeleting = true; type(); }, pause);
                } else if (isDeleting && i === 0) {
                    isDeleting = false;
                    setTimeout(type, speed * 2);
                } else {
                    i += isDeleting ? -1 : 1;
                    setTimeout(type, isDeleting ? speed / 2 : speed);
                }
            }
            type();
        }

        // === ENTER ===
        function enter() {
            document.getElementById('landing').classList.add('out');
            audio.play().catch(() => {});
            setTimeout(() => {
                document.getElementById('landing').style.display = 'none';
                frame.classList.add('in');
                sideFrame.classList.add('in');
                player.classList.add('show');
                typeWriterRepeat(profileName, "mev/vsqz", 120, 3000);
                setTimeout(() => typeWriterRepeat(bio, "Gate Way To Hell", 90, 2500), 1200);
            }, 1500);
        }

        // === AUDIO ===
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = 'Pause';
            } else {
                audio.pause();
                playBtn.textContent = 'Play';
            }
        });

        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100 || 0;
            progress.style.width = percent + '%';
        };

        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value;
        });

        // === ACCOUNTS ===
        function populateAccounts() {
            accountsList.innerHTML = '';
            discordAccounts.forEach(acc => {
                const item = document.createElement('div');
                item.className = 'account-item';
                item.innerHTML = `<div class="account-name">${acc}</div>`;
                accountsList.appendChild(item);
            });
        }

        // === INIT ===
        window.onload = () => {
            populateAccounts();
            typeWriterRepeat(landingTitle, "mev/vsqz", 120, 3000);
            setTimeout(() => typeWriterRepeat(landingSubtitle, "click to enter hell", 80, 2500), 1000);
            audio.volume = 0.5;
        };
    </script>
</body>
</html>
