<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mev/vsqz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');

        :root {
            --bg: #000;
            --card: rgba(8, 8, 12, 0.2); /* 80% transparent */
            --border: rgba(255, 255, 255, 0.18);
            --glow: rgba(255, 255, 255, 0.1);
            --text: #ccc;
            --subtext: #999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Orbitron', sans-serif; }

        /* Background GIF */
        .bg-gif {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.2);
        }

        /* Landing */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text);
            text-shadow: 0 0 12px var(--glow);
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
        }

        .enter {
            font-size: 1rem;
            color: var(--subtext);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 500;
        }

        /* Fade Out */
        #landing.out {
            animation: fadeOut 1.4s forwards;
            pointer-events: none;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; filter: blur(14px); transform: scale(1.05); }
        }

        /* Ultra-Ghost Frame */
        #frame {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) perspective(1000px);
            width: 90%;
            max-width: 460px;
            background: var(--card);
            border: 1.2px solid var(--border);
            border-radius: 16px;
            padding: 2rem 1.8rem;
            text-align: center;
            box-shadow: 0 0 25px var(--glow);
            backdrop-filter: blur(18px);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            transform-style: preserve-3d;
        }
        #frame.in { opacity: 1; pointer-events: all; }

        .pfp-ring {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 1.2rem;
        }
        .pfp {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            box-shadow: 0 0 15px var(--glow);
        }
        .ring-glow {
            position: absolute;
            top: -8px; left: -8px;
            width: 126px; height: 126px;
            border: 1.5px solid var(--border);
            border-radius: 50%;
            opacity: 0.2;
            animation: pulse 5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.25); opacity: 0.05; }
        }

        .name {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
            text-shadow: 0 0 6px var(--glow);
        }

        /* Circle Links */
        .circle-links {
            display: flex;
            justify-content: center;
            gap: 1.4rem;
            margin-bottom: 1.8rem;
        }
        .circle {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }
        .circle:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.2) translateY(-6px);
            box-shadow: 0 0 18px var(--glow);
        }
        .circle img {
            width: 26px; height: 26px;
            filter: brightness(0) invert(1);
            opacity: 0.85;
        }

        /* Audio Player - 80% Transparent */
        #audio-player {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(8, 8, 12, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            backdrop-filter: blur(14px);
        }
        #audio-player.show { opacity: 1; pointer-events: all; }

        .song-name {
            font-size: 0.75rem;
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
        }

        .play-btn {
            background: none;
            border: 1.2px solid var(--border);
            color: var(--text);
            width: 38px; height: 38px;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .play-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.12);
            box-shadow: 0 0 12px var(--glow);
        }

        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 0.8rem;
        }
        .progress {
            height: 100%;
            background: var(--text);
            width: 0%;
            border-radius: 2px;
            opacity: 0.7;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .title { font-size: 2.2rem; }
            .enter { font-size: 0.85rem; }
            #frame { padding: 1.6rem; }
            .circle { width: 44px; height: 44px; }
            .circle img { width: 22px; height: 22px; }
            .play-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .song-name { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Background GIF -->
    <img src="https://vault13.lol/squeez.gif" class="bg-gif" alt="bg">

    <!-- Landing -->
    <div id="landing" onclick="enter()">
        <div class="title">mev/vsqz</div>
        <div class="enter">click to enter hell</div>
    </div>

    <!-- Audio (Loop Forever) -->
    <audio id="hellsong" src="https://github.com/mevvvvv/vault13.lol/raw/refs/heads/main/freestyle.mp3" loop preload="auto"></audio>

    <!-- Main Frame -->
    <div id="frame">
        <div class="pfp-ring">
            <div class="ring-glow"></div>
            <img src="https://cdn.discordapp.com/attachments/1363714836621689002/1434441273703534713/mhhh.png?ex=6908570a&is=6907058a&hm=a045d8b3594ec75bfad7b8e8e6cba84a81f8c6fcfe98a68f9c2448370d028124&" alt="pfp" class="pfp">
        </div>
        <div class="name">mev/vsqz</div>

        <!-- Circle Links -->
        <div class="circle-links">
            <a href="https://discord.gg/bkNT9x3qs9" target="_blank" class="circle">
                <img src="https://cdn.simpleicons.org/discord/white" alt="Discord">
            </a>
            <a href="nhttps://www.roblox.com/users/7758899851/profile" target="_blank" class="circle">
                <img src="https://cdn.simpleicons.org/roblox/white" alt="Roblox">
            </a>
            <a href="https://github.com/mevvvvv" target="_blank" class="circle">
                <img src="https://cdn.simpleicons.org/github/white" alt="GitHub">
            </a>
        </div>
    </div>

    <!-- Audio Player -->
    <div id="audio-player">
        <div class="song-name">Freestyle - mev/vsqz</div>
        <div class="player-controls">
            <div class="progress-container">
                <div class="progress" id="progress"></div>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('hellsong');
        const progress = document.getElementById('progress');
        const frame = document.getElementById('frame');
        const player = document.getElementById('audio-player');

        // Force loop
        audio.loop = true;
        audio.onended = () => audio.play();

        // Enter
        function enter() {
            document.getElementById('landing').classList.add('out');
            audio.play();
            setTimeout(() => {
                document.getElementById('landing').style.display = 'none';
                frame.classList.add('in');
                player.classList.add('show');
            }, 1400);
        }

        // Progress bar (visual only)
        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100 || 0;
            progress.style.width = percent + '%';
        };

        // Mouse Tilt
        document.addEventListener('mousemove', (e) => {
            if (!frame.classList.contains('in')) return;
            const x = (window.innerWidth / 2 - e.clientX) / 45;
            const y = (window.innerHeight / 2 - e.clientY) / 45;
            frame.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${y}deg) rotateY(${x}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            frame.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(0) rotateY(0)`;
        });
    </script>

</body>
</html>
