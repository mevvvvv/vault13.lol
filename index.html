<script>
  const $ = id => document.getElementById(id);

  // ────── STARFALL ANIMATION ──────
  function createStar() {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.width = star.style.height = `${size}px`;
    star.style.left = `${Math.random() * 100}vw`;
    star.style.animationDuration = `${Math.random() * 8 + 5}s`;
    star.style.animationDelay = `${Math.random() * 5}s`;
    star.style.opacity = Math.random() * 0.6 + 0.3;
    $('#stars').appendChild(star);
    setTimeout(() => star.remove(), 15000);
  }
  setInterval(createStar, 300);
  for (let i = 0; i < 40; i++) setTimeout(createStar, i * 100);

  // ────── SOUND PLAYER ──────
  function playEntrySound() {
    const audio = new Audio('https://github.com/mevvvvv/vault13.lol/raw/refs/heads/main/heheee.mp3');
    audio.volume = 0.7;
    audio.play().catch(e => console.log('Audio play failed:', e));
  }

  // ────── DISCORD PFP FROM ID ONLY (NO AVATAR HASH) ──────
  function getDiscordAvatar(discordId, size = 80) {
    if (!discordId || isNaN(discordId)) {
      return `https://cdn.discordapp.com/embed/avatars/0.png`;
    }
    // Discord default avatars cycle 0–5 based on ID % 6
    return `https://cdn.discordapp.com/embed/avatars/${Number(discordId) % 6}.png`;
  }

  // ────── LOADER ──────
  function enterLeaderboard() {
    playEntrySound();
    const loader = $('loader');
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.classList.add('hidden');
      $('app').classList.remove('hidden');
      fetchLeaderboard();
      setInterval(fetchLeaderboard, 90000);
    }, 1000);
  }
  $('loader').addEventListener('click', enterLeaderboard);
  $('loader').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      enterLeaderboard();
    }
  });
  setTimeout(() => $('loader').focus(), 100);

  // ────── FETCH LEADERBOARD (FROM JSON FILE) ──────
  async function fetchLeaderboard() {
    const loading = $('loading');
    const board = $('board');
    const rows = $('rows');
    const updated = $('updated');
    try {
      const res = await fetch('leaderboard.json?' + Date.now());
      if (!res.ok) throw new Error('Not found');
      const data = await res.json();
      let list = Array.isArray(data) ? data : (data.leaderboard || []);
      const time = data.updated || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const paddedList = [];
      for (let i = 0; i < 100; i++) {
        paddedList.push(list[i] || { rank: i + 1 });
      }

      rows.innerHTML = paddedList.map((p, idx) => {
        const hasData = p.name || p.discord || p.discordId;
        const discordId = p.discordId;
        const avatarUrl = getDiscordAvatar(discordId);
        const rank = p.rank || (idx + 1);

        return `
          <tr>
            <td class="rank">${rank}</td>
            <td class="name">
              ${hasData ? `
              <div class="avatar">
                <img src="${avatarUrl}"
                     alt="${e(p.name || 'User')} avatar">
              </div>
              <div>
                <div style="font-weight:600;font-size:.98rem;">${e(p.name || 'Unknown')}</div>
                ${p.discord ? `<div class="discord-tag"><i class="fab fa-discord"></i>${e(p.discord)}</div>` : ''}
              </div>
              ` : `<div class="empty-slot">— Empty Slot —</div>`}
            </td>
          </tr>`;
      }).join('');

      updated.textContent = `Last updated: ${time}`;
      loading.classList.add('hidden');
      board.classList.remove('hidden');
    } catch (err) {
      loading.textContent = 'Failed to load leaderboard.json';
      loading.style.color = '#f88';
    }
  }

  // ────── ESCAPE HTML ──────
  function e(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  // ────── DEMO MODE (LOCAL ONLY) ──────
  window.addEventListener('DOMContentLoaded', () => {
    if (window.location.protocol === 'file:') {
      const sampleData = {
        leaderboard: [
          { rank: 1, name: "Electro Queen", discord: "electroqueen#1234", discordId: "123456789012345678" },
          { rank: 2, name: "Beat Master", discord: "beatmaster#5678", discordId: "987654321098765432" },
          { rank: 3, name: "Rhythm Rebel", discord: "rhythmrebel#9012", discordId: "456789123456789123" }
        ],
        updated: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      const originalFetch = window.fetch;
      window.fetch = function(url) {
        if (url.includes('leaderboard.json')) {
          return Promise.resolve({
            ok: true,
            json: () => Promise.resolve(sampleData)
          });
        }
        return originalFetch.apply(this, arguments);
      };
    }
  });
</script>
